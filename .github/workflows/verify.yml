name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: package-table drift + live-domain probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Structural gate — may pass while apex DNS is still owner-blocked.
  structural:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Structural checks (no third-party requests, CNAME, security.txt, table)
        run: python3 tools/verify_site.py

  # Package-table drift vs szl-org-health manifest (schedule / dispatch only).
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Package table matches the szl-org-health manifest
        run: python3 tools/render_packages.py --check

  # Live HTTPS owner-action lane — MUST fail closed while TLS is dead.
  # Do not soft-exit TLS EOF. DNS remains owner-blocked (apex A=34.111.179.208).
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: https://szlholdings.com serves this page
        id: live
        run: |
          set -uo pipefail
          DNS_SHEET="ops/rosa-paste/G-SZLHOLDINGS-COM-DNS-FIX-LATEST.md (house HQ) — replace apex A with GitHub Pages 185.199.108-111.153; CNAME www → szl-holdings.github.io"
          apex_a="$(dig +short szlholdings.com A 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          echo "measured_dns_a=${apex_a:-UNAVAILABLE}"
          set +e
          body="$(curl -fsSL --max-time 30 https://szlholdings.com/ 2>/tmp/szl-live-curl.err)"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            err="$(tr -cd '[:print:]\n' </tmp/szl-live-curl.err | head -c 400)"
            if echo "$err" | grep -Eiq 'unexpected eof|ssl routines|tls connect|SSL_ERROR|certificate'; then
              echo "state=LIVE_TLS_FAILED" >> "$GITHUB_OUTPUT"
              echo "::error title=LIVE_TLS_FAILED::curl exit ${curl_rc}: ${err}"
              echo "live: HARD-FAIL TLS (DNS still not on GitHub Pages). Owner click: ${DNS_SHEET}"
              echo "ACTION: point szlholdings.com A records to GitHub Pages 185.199.108-111.153"
              exit 1
            fi
            echo "state=LIVE_PROBE_FAILED" >> "$GITHUB_OUTPUT"
            echo "::error title=LIVE_PROBE_FAILED::Unexpected live probe failure (not a measured TLS EOF). ${err}"
            exit 1
          fi
          if ! grep -q "company domain of record" <<<"$body"; then
            echo "state=LIVE_CONTENT_MISMATCH" >> "$GITHUB_OUTPUT"
            echo "::error title=LIVE_CONTENT_MISMATCH::HTTPS answered but marker text missing"
            exit 1
          fi
          if ! curl -fsSL --max-time 30 https://szlholdings.com/.well-known/security.txt | grep -q "Contact: mailto:stephen@szlholdings.com"; then
            echo "state=LIVE_SECURITY_TXT_MISMATCH" >> "$GITHUB_OUTPUT"
            echo "::error title=LIVE_SECURITY_TXT_MISMATCH::security.txt contact missing over HTTPS"
            exit 1
          fi
          echo "state=LIVE_HTTPS_OK" >> "$GITHUB_OUTPUT"
          echo "live: page and security.txt served over HTTPS"
